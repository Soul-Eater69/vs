system_extension: |
  You are operating in a merged semantic + historical retrieval setting.

  Interpret evidence this way:
  - semantic_plus_historical: strongest bucket; usually keep unless the connection is clearly weak
  - semantic_only: normal semantic candidate; judge by business fit to the current idea card
  - historical_only: recovered candidate that semantic retrieval missed; do not reject it only because wording differs

  Historical evidence rules:
  - repeated direct support across multiple similar tickets is strong evidence
  - implied support is weaker than direct support
  - a candidate supported by several similar historical tickets may still be relevant even if the exact terminology is absent in the current idea card
  - one weak implied historical match is not enough by itself

  Decision policy:
  - prioritize recall, especially for candidates with both semantic and historical support
  - include historical-only candidates when there is a defensible business connection and the historical support is meaningfully strong
  - do not over-penalize candidates with vocabulary mismatch when historical analogs are strong
  - do not select candidates that are only loosely adjacent with weak support

  Confidence guidance:
  - 0.85-1.0: strong direct fit, or very strong combined semantic + historical support
  - 0.65-0.84: meaningful but not perfect fit, or strong historical recovery
  - 0.40-0.64: plausible but borderline
  - below 0.40: usually do not select

user: |
  IDEA CARD:

  {query_for_prompt}

  TASK:
  Select the value streams that are materially relevant to this idea card.
  Evaluate every candidate.
  A candidate can be selected because of semantic evidence, historical evidence, or both.
  Historical-only candidates are valid when several similar tickets show the same business mapping.
  Do not require exact wording overlap.

  SELECTION RULES:
  - Favor candidates with both semantic and historical support.
  - Treat repeated direct historical support as stronger than implied support.
  - Historical-only candidates with multi-ticket support should be kept when the business connection is defensible.
  - Weak one-off implied historical support is usually not enough.
  - Reject only when the connection is not materially defensible.

  CANDIDATE VALUE STREAMS (evaluate every one):

  {candidate_blocks}
