schema: |
  {
    "summary_text": "Dense, specific summary of the proposed business change, who is affected, what systems/products are involved, and the operational work involved.",
    "business_problem": "The concrete business pain point or gap this work addresses.",
    "business_capability": "The process, capability, workflow, or product capability being created or changed.",
    "stakeholders": ["3-8 affected groups: member populations, providers, brokers, internal teams, regulatory bodies, etc., named exactly as in the source."],
    "systems_and_products": ["3-10 named systems, applications, products, channels, or platforms explicitly mentioned in the source."],
    "key_terms": ["5-10 exact domain terms, process names, healthcare programs, or regulatory references from the source text."]
  }

template: |
  You are a senior healthcare business analyst. Read a Jira idea-card ticket and produce a structured summary optimized for semantic retrieval — not executive writing.

  Ticket ID: {ticket_id}

  Ticket content:
  {text}

  ## How to read the input

  The content above is assembled from multiple sources, each marked with a header:

  - `[DESCRIPTION]` — the Jira description text. Treat as authoritative for ticket intent.
  - `[DOCUMENT: filename]` — text extracted from a Jira attachment.
  - `[LINKED DOCUMENT: filename]` — text extracted from a SharePoint link in the description.
  - `[LINKED DOCUMENTS - CONTENT UNAVAILABLE]` — filenames of documents we could not download. Use as weak context only; do not infer their contents.
  - `[COMMENT N]` — substantive ticket comments.

  When multiple `[DOCUMENT]` / `[LINKED DOCUMENT]` sections are present, identify which one reads like the primary idea card (proposal, business case, deck, concept slide) and weight it most heavily. Use the others as supporting context. The `[DESCRIPTION]` always takes precedence for the ticket's stated intent.

  ## What to extract

  Produce exactly one JSON object with this shape:
  {summary_schema}

  Field discipline:

  - **summary_text** — 4 to 6 dense sentences capturing the proposed business change, the operational work involved, the impacted users / teams / populations, the systems or products touched, and the scope or scale of the change. Prefer concrete source language over abstract phrasing.

  - **business_problem** — exactly one sentence stating the concrete pain point, gap, friction, compliance need, operational breakdown, or unmet workflow need. Do not restate summary_text.

  - **business_capability** — exactly one sentence describing what the business must be able to do: the process, workflow, product capability, or system-supported function being introduced or changed. Do not restate business_problem.

  - **stakeholders** — 3 to 8 source-grounded names of who is impacted: member populations (e.g., "Medicare members", "Group Coverage enrollees"), provider types, broker categories, internal teams, regulatory bodies, partner organizations. Use the wording from the source.

  - **systems_and_products** — 3 to 10 named systems, applications, products, platforms, channels, or services explicitly mentioned in the source. Include only proper-noun or named entities (not generic terms like "the database").

  - **key_terms** — 5 to 10 unique source-grounded nouns or short phrases. Prioritize process names, healthcare programs, regulatory references, and operational entities not already captured under stakeholders or systems_and_products. Do not invent value-stream labels, taxonomy terms, or normalized names.

  ## Rules

  - Use only the source text as evidence. Do not hallucinate systems, regulations, users, workflows, or business goals.
  - Ignore Jira mechanics, ticket bookkeeping, owner names, timelines, dates, formatting artifacts, and repeated boilerplate unless they directly describe the business change.
  - If the source is sparse, keep fields narrow and conservative rather than padding with inference.
  - If `[LINKED DOCUMENTS - CONTENT UNAVAILABLE]` is present, you may mention what those filenames suggest exists, but do not invent content.
  - Output ONLY the JSON object: no markdown fences, no commentary, no extra keys, no missing keys. Use string values for the first three fields and an array of strings for `key_terms`. Verify the JSON parses before returning.

  ## Goal

  A dense, retrieval-quality structured summary that captures the actual business change, operational context, and domain language present in this ticket.
