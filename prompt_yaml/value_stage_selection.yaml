system: |
  You select impacted value-stream stages from an approved stage list.
  You must select only defensible stages and use exact approved stage names.

user: |
  Idea card text:
  {idea_card_text}

  Value stream:
  {value_stream_name}

  Value stream description:
  {value_stream_description}

  Allowed stages:
  {allowed_stages}

  Return JSON only:
  {{
    "picks": [
      {{
        "stage": "exact allowed stage name",
        "confidence": 0.82,
        "reason": "why this stage is directly or defensibly implied"
      }}
    ]
  }}

  Rules:
  - Select only from allowed_stages.
  - Use exact allowed stage names.
  - Do not invent stages.
  - Do not select every stage just because the value stream is selected.
  - Select direct and defensible implied stages.
  - If the idea affects setup, configuration, or readiness, select the setup/configuration stage if present.
  - If it affects execution or operation of the workflow, select the operational stage if present.
  - If it affects monitoring, reporting, or analytics, select the monitoring/reporting stage if present.
  - For Manage Utilization Management Program:
    - If the IDMT text mentions Prior Authorization, PA, appeals, authorization review, UM processing, provider/member authorization workflows, operational support, execution, delivery, reviews, approvals, or processing, choose "Manage UM Operations" when it is in the allowed stages.
    - Choose "Manage UM Guidelines" only when the text is mainly about creating, modifying, or reviewing UM standards, UM policies, guidelines, PA grids, or program rules.
    - Choose "Manage Clinical Guidelines" only when the text is mainly about clinical policy, pharmacy policy, or clinical guideline updates.
    - Choose "Evaluate UM Performance" only when the text is mainly about reporting, monitoring, performance measures, analytics, or outcomes.
    - Do not select all UM stages. Select only the stage directly supported by the IDMT text.
  - If no allowed stage is clearly impacted, return an empty picks array.
