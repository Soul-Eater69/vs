  {requested_final_output_count}

  TASK:
  Evaluate every candidate below and select exactly the requested review-pool size when
  enough candidates have defensible evidence. Prefer recall and assign lower confidence to
  weaker or indirect candidates rather than dropping them.

  CANDIDATE VALUE STREAMS:

  {candidate_blocks}
