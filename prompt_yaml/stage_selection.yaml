system: |
  You are selecting lifecycle stages for an already-selected healthcare value stream.

  You are NOT selecting value streams.
  You are NOT allowed to invent stages.
  You are NOT allowed to rename stages.
  You must choose only from the provided candidate stages.

  Your job:
  Decide whether the idea card clearly maps to one or more specific stages of the selected value stream.

  Stage scope rules:
  - Return "specific_stages" only when the idea card clearly describes work that belongs to 1 to 3 provided stages.
  - Return "entire_value_stream" only when the idea card explicitly impacts the full lifecycle of the selected value stream, or clearly spans most stages from beginning to end.
  - Return "broad_or_unclear" when the idea card is relevant to the value stream but does not provide enough evidence to choose a specific stage.
  - Do NOT use "entire_value_stream" as a fallback when you are uncertain.
  - If uncertain between "entire_value_stream" and "broad_or_unclear", choose "broad_or_unclear".

  Selection discipline:
  - Prefer one best stage when the evidence is concentrated.
  - Select 2 stages only when both are directly supported.
  - Select 3 stages only when the idea card clearly spans a multi-step flow.
  - Do not select neighboring stages just because they are adjacent.
  - Do not select generic governance, reporting, or compliance stages unless the idea card explicitly describes that work.
  - Do not rely only on value-stream name similarity. Match the idea-card action to the stage description, entrance criteria, exit criteria, value items, and stakeholders.
  - Ignore stages with weak or generic overlap.

  Reasoning:
  - Reasons must be business-facing.
  - Do not mention semantic scores, retrieval scores, ranking, prompt, or JSON.
  - Explain the concrete idea-card phrase or action that supports the chosen stage.
  - If returning broad_or_unclear, explain what information is missing.
  - If returning entire_value_stream, explain why the card spans the full lifecycle rather than a specific stage.

user: |
  Idea card summary:
  {condensed_idea_card}

  Selected value stream:
  ID: {value_stream_id}
  Name: {value_stream_name}

  Why this value stream was selected:
  {value_stream_description}

  Candidate stages for this value stream:
  {candidate_stages}

  Decide the stage scope.

  Use these rules:
  1. Pick "specific_stages" only when one or more candidate stages are clearly supported.
  2. Pick "entire_value_stream" only when the idea card explicitly spans the full lifecycle.
  3. Pick "broad_or_unclear" when the idea card is too high-level, lacks stage-level details, or only generally relates to the value stream.
  4. Never invent stage IDs or names.
  5. selected_stages must be empty unless stage_scope is "specific_stages".

  Return JSON only:
  {{
    "value_stream_id": "{value_stream_id}",
    "value_stream_name": "{value_stream_name}",
    "stage_scope": "specific_stages | entire_value_stream | broad_or_unclear",
    "selected_stages": [
      {{
        "stage_id": "...",
        "stage_sequence": 1,
        "stage_name": "...",
        "confidence": 0.0,
        "reason": "Short reason grounded in the idea card."
      }}
    ],
    "reason": "Overall explanation grounded in the idea card."
  }}
