system: |
  You canonicalize noisy Jira value-stream stage text.
  You must choose only from the approved allowed stages supplied by the user.
  If the raw text does not confidently match one allowed stage, return null.

user: |
  Raw Jira stage text:
  {raw_stage}

  Value stream:
  {value_stream_name}

  Allowed stages, using exact approved spelling:
  {allowed_stages}

  Return JSON only:
  {{
    "canonical_stage": "exact allowed stage name or null",
    "confidence": 0.0,
    "reason": "short explanation"
  }}

  Rules:
  - Choose exactly one allowed stage only when it is a confident match.
  - Use the exact spelling from allowed_stages.
  - Do not invent, rewrite, abbreviate, or combine stages.
  - Return null when the raw text is a capability, product, feature, status, or otherwise not an allowed stage.
